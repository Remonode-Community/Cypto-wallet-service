name: crypto-wallet-service

services:
  # ---------- API (Express + TypeScript) ----------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: crypto-wallet-api:1.0.0
    container_name: crypto-wallet-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8000}
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL}
    networks:
      - backend
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Intentionally not published: only reachable through the nginx edge.
    # Uncomment for direct debugging:
    # ports:
    #   - "8000:8000"

  # ---------- MongoDB (auth + single-node replica set) ----------
  mongo:
    image: mongo:8.0
    container_name: crypto-wallet-mongo
    restart: unless-stopped
    # Writes the required replica-set keyFile, then runs the official
    # entrypoint (which bootstraps the root user) with mongod's flags.
    entrypoint: ["/bin/bash", "/entrypoint-wrapper.sh"]
    volumes:
      - ./mongo/entrypoint.sh:/entrypoint-wrapper.sh:ro
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-crypto_wallet}
      MONGO_REPLSET_KEYFILE: ${MONGO_REPLSET_KEYFILE}
    networks:
      - backend
    healthcheck:
      # Authenticates, then initiates the replica set on first boot.
      # Host must be the compose service name so the driver can discover it.
      test:
        - CMD-SHELL
        - >
          mongosh --quiet
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval 'try { rs.status().ok } catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] }).ok }'
          | grep -q 1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------- Redis (auth + AOF persistence) ----------
  redis:
    image: redis:8-alpine
    container_name: crypto-wallet-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-volatile-lru}
      - --protected-mode
      - "yes"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------- Nginx edge (reverse proxy, TLS-ready) ----------
  nginx:
    image: nginx:1.29-alpine
    container_name: crypto-wallet-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      # Enable after mounting certificates (see nginx/nginx.conf):
      # - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./certs:/etc/nginx/certs:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
